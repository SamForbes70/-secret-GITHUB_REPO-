name: Maps4U CI, Determinism & Docker Smoke Gate

on:
  push:
    branches: ["main", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Lint, Typecheck, 76 Offline Tests, Wheel & Maintenance Drills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system geospatial & Cairo libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            fonts-liberation \
            gdal-bin \
            libcairo2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            pkg-config \
            sqlite3

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Maps4U runtime and dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests scripts

      - name: Run MyPy type checker
        run: mypy src/maps4u/core src/maps4u/geo

      - name: Run full offline test suite (Gates G1-G6 + v1.0.1 regressions)
        env:
          MAPS4U_QUEUE: inline
          MAPS4U_ENV: test
        run: pytest -m "not live" -v

      - name: Run end-to-end smoke test script
        run: python scripts/smoke_test.py

      - name: Run determinism verification script
        run: python scripts/verify_determinism.py

      - name: Run online SQLite WAL + artifact backup/restore drill
        run: python scripts/backup_restore_drill.py

      - name: Verify non-editable wheel packaging and isolated resource loading
        run: |
          pip wheel --no-deps . -w /tmp/wheelhouse
          mkdir -p /tmp/isolated_site /tmp/isolated_cwd
          python -m zipfile -e /tmp/wheelhouse/maps4u-*.whl /tmp/isolated_site
          cd /tmp/isolated_cwd
          PYTHONPATH=/tmp/isolated_site python -c "
          import maps4u
          from maps4u.layout.templates import load_paper_templates
          from maps4u.render.style_engine import load_style_by_ref
          assert len(load_paper_templates()) == 6
          assert load_style_by_ref('mcy/v1').style_ref == 'mcy/v1'
          "

  docker-smoke:
    name: Docker Build & 3-Service Compose Smoke Test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start Redis, API, and Celery Worker
        env:
          MAPS4U_ENV: prod
          MAPS4U_OPERATOR_TOKEN: ci-operator-secret-token
          MAPS4U_REVIEWER_TOKEN: ci-reviewer-secret-token
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          docker compose down -v
