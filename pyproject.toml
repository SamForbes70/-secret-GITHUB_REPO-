[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maps4u"
dynamic = ["version"]
description = "Maps4U Deterministic Street Map Production System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyogrio>=0.7.0",
    "overpy>=0.7",
    "osmnx>=1.9.0",
    "PyYAML>=6.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.8.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maps4u = ["core/migrations/*.sql"]

[tool.setuptools.dynamic]
version = {attr = "maps4u.__version__"}

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: marks tests that hit live external Overpass API (deselect by default)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
