style_version: "1.0.0"
meta:
  style_ref: "mcy/v1"
  derived_from: "MCY-reference.pdf (Maroochydore Street Map Baseline)"
  approved: false
  notes: "Pilot-provisional cartographic values derived from Maroochydore reference map."

fonts:
  suburb:
    family: "DejaVuSans-Bold"
    weight: "bold"
    size_mm: 4.5
    halo:
      color: "#ffffff"
      width_mm: 0.6
  landmark:
    family: "DejaVuSans-Bold"
    weight: "bold"
    size_mm: 2.8
    halo:
      color: "#ffffff"
      width_mm: 0.4
  arterial:
    family: "DejaVuSans-Bold"
    weight: "bold"
    size_mm: 2.6
    spacing_mm: 0.1
    halo:
      color: "#ffffff"
      width_mm: 0.4
  collector:
    family: "DejaVuSans"
    weight: "regular"
    size_mm: 2.1
    halo:
      color: "#ffffff"
      width_mm: 0.3
  local:
    family: "DejaVuSans"
    weight: "regular"
    size_mm: 1.8
  service:
    family: "DejaVuSans"
    weight: "regular"
    size_mm: 1.5

label_rules:
  priority_order:
    - "suburb"
    - "landmark"
    - "arterial"
    - "collector"
    - "local"
    - "service"
  candidate_order:
    - "above"
    - "below"
    - "left"
    - "right"
  repeat_every_mm: 120.0
  max_repeats: 3
  min_font_mm: 1.5
  packing_factor: 1.8
  min_same_name_distance_mm: 52.0

layers:
  background:
    fill: "#f9f6ef"
    z: 0
  water:
    fill: "#aad3df"
    stroke:
      color: "#76b4c6"
      width_mm: 0.2
    z: 1
  parks:
    fill: "#c8e6c9"
    stroke:
      color: "#9ccc9c"
      width_mm: 0.15
    z: 2
  water_lines:
    stroke:
      color: "#76b4c6"
      width_mm: 0.45
    z: 3
  coastline:
    stroke:
      color: "#4a8fa3"
      width_mm: 0.35
    z: 4
  roads:
    motorway:
      casing:
        color: "#3d3d3d"
        width_mm: 1.8
      fill:
        color: "#ffd54f"
        width_mm: 1.3
      z: 22
    trunk:
      casing:
        color: "#454545"
        width_mm: 1.5
      fill:
        color: "#ffe082"
        width_mm: 1.1
      z: 20
    primary:
      casing:
        color: "#4a4a4a"
        width_mm: 1.3
      fill:
        color: "#fff59d"
        width_mm: 0.95
      z: 18
    secondary:
      casing:
        color: "#555555"
        width_mm: 1.1
      fill:
        color: "#ffffff"
        width_mm: 0.8
      z: 16
    tertiary:
      casing:
        color: "#666666"
        width_mm: 0.95
      fill:
        color: "#ffffff"
        width_mm: 0.68
      z: 14
    residential:
      casing:
        color: "#777777"
        width_mm: 0.75
      fill:
        color: "#ffffff"
        width_mm: 0.52
      z: 12
    unclassified:
      casing:
        color: "#777777"
        width_mm: 0.70
      fill:
        color: "#ffffff"
        width_mm: 0.48
      z: 11
    service:
      casing:
        color: "#888888"
        width_mm: 0.50
      fill:
        color: "#f5f5f5"
        width_mm: 0.32
      z: 10
    track:
      casing:
        color: "#999999"
        width_mm: 0.40
      fill:
        color: "#eeeeee"
        width_mm: 0.25
      z: 9
  boundaries:
    stroke:
      color: "#7c6f64"
      width_mm: 0.4
      dash: [2.0, 1.5]
    z: 30

scale_bands:
  - name: "detail"
    denominator_max: 8000
    simplify_tolerance_m: 0.5
    road_classes:
      - "motorway"
      - "trunk"
      - "primary"
      - "secondary"
      - "tertiary"
      - "residential"
      - "unclassified"
      - "service"
      - "track"
    include_layers:
      - "water"
      - "parks"
      - "water_lines"
      - "coastline"
      - "roads"
      - "boundaries"
      - "places"
      - "landmarks"
  - name: "standard_street"
    denominator_max: 20000
    simplify_tolerance_m: 1.5
    road_classes:
      - "motorway"
      - "trunk"
      - "primary"
      - "secondary"
      - "tertiary"
      - "residential"
      - "unclassified"
    include_layers:
      - "water"
      - "parks"
      - "water_lines"
      - "coastline"
      - "roads"
      - "boundaries"
      - "places"
      - "landmarks"
  - name: "overview"
    denominator_max: 50000
    simplify_tolerance_m: 5.0
    road_classes:
      - "motorway"
      - "trunk"
      - "primary"
      - "secondary"
      - "tertiary"
    include_layers:
      - "water"
      - "parks"
      - "water_lines"
      - "coastline"
      - "roads"
      - "boundaries"
      - "places"
